<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3880ff" />
      <stop offset="50%" stop-color="#5260ff" />
      <stop offset="100%" stop-color="#2dd36f" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="150" cy="120" r="90" fill="#3880ff" opacity="0.15" />
  <circle cx="680" cy="380" r="110" fill="#2dd36f" opacity="0.15" />
  <circle cx="650" cy="100" r="60" fill="#5260ff" opacity="0.1" />

  <!-- Smartphone device frame -->
  <g transform="translate(250, 40)" filter="url(#shadow)">
    <!-- Phone body -->
    <rect x="0" y="0" width="300" height="420" rx="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
    <!-- Screen area -->
    <rect x="15" y="20" width="270" height="380" rx="28" fill="#f8fafc" />
    
    <!-- Phone top speaker -->
    <rect x="110" y="28" width="80" height="6" rx="3" fill="#cbd5e1" />
    
    <!-- App Header inside phone -->
    <rect x="25" y="45" width="250" height="85" rx="18" fill="url(#bgGrad)" />
    <circle cx="60" cy="87" r="22" fill="#ffffff" opacity="0.2" />
    <text x="95" y="80" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">PayFlow App</text>
    <text x="95" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#e0f2fe">Registro y Cobro Fácil</text>

    <!-- Mini Product Card inside screen -->
    <rect x="25" y="145" width="250" height="75" rx="14" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" filter="url(#shadow)" />
    <rect x="37" y="157" width="50" height="50" rx="10" fill="#e0f2fe" />
    <!-- Mini cart icon -->
    <path d="M48 172 h6 l4 16 h18 l3 -12 h-22" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="59" cy="193" r="2.5" fill="#0284c7" />
    <circle cx="73" cy="193" r="2.5" fill="#0284c7" />
    <text x="98" y="174" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Producto Registrado</text>
    <text x="98" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Cantidad: 2 × $15.00</text>
    <text x="235" y="184" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2dd36f">$30.00</text>

    <!-- Mini Payment calculation card inside screen -->
    <rect x="25" y="235" width="250" height="135" rx="14" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" />
    <text x="40" y="260" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Subtotal:</text>
    <text x="245" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end" fill="#1e293b">$30.00</text>
    
    <text x="40" y="285" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Descuento (10%):</text>
    <text x="245" y="285" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end" fill="#e11d48">-$3.00</text>
    
    <line x1="40" y1="300" x2="255" y2="300" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4" />
    
    <text x="40" y="325" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Total a Pagar:</text>
    <text x="245" y="325" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="end" fill="#0284c7">$27.00</text>

    <rect x="40" y="338" width="215" height="24" rx="6" fill="#dcfce7" />
    <text x="147" y="354" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#15803d">✔ Cambio exacto calculado</text>
  </g>

  <!-- Left Floating Credit Card -->
  <g transform="translate(60, 240) rotate(-12)" filter="url(#shadow)">
    <rect width="210" height="130" rx="16" fill="url(#cardGrad)" />
    <!-- Chip -->
    <rect x="25" y="40" width="32" height="24" rx="5" fill="url(#goldGrad)" />
    <circle cx="165" cy="45" r="16" fill="#ef4444" opacity="0.8" />
    <circle cx="182" cy="45" r="16" fill="#f59e0b" opacity="0.8" />
    <text x="25" y="98" font-family="monospace" font-size="13" fill="#ffffff" letter-spacing="2">•••• 8492</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">PAYFLOW CARD</text>
  </g>

  <!-- Right Floating Cash & Coins -->
  <g transform="translate(560, 210) rotate(10)" filter="url(#shadow)">
    <!-- Dollar Bill -->
    <rect width="180" height="100" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="2" />
    <rect x="10" y="10" width="160" height="80" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6" />
    <circle cx="90" cy="50" r="24" fill="#22c55e" opacity="0.15" />
    <text x="90" y="58" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#16a34a">$</text>
    <text x="22" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">100</text>
    <text x="158" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#16a34a">100</text>
  </g>

  <!-- Gold Coins -->
  <g transform="translate(620, 310)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="28" fill="url(#goldGrad)" stroke="#d97706" stroke-width="2" />
    <circle cx="0" cy="0" r="21" fill="none" stroke="#fef3c7" stroke-width="1.5" />
    <text x="0" y="9" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#78350f">$</text>
  </g>
  <g transform="translate(665, 345)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="url(#goldGrad)" stroke="#d97706" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#fef3c7" stroke-width="1" />
    <text x="0" y="7" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#78350f">$</text>
  </g>
</svg>
