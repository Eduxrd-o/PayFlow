<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3880ff" />
      <stop offset="100%" stop-color="#2dd36f" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#3880ff" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2732" height="2732" fill="url(#splashBg)" />

  <!-- Background decorative glowing rings -->
  <circle cx="1366" cy="1200" r="600" fill="none" stroke="#3880ff" stroke-width="3" opacity="0.15" />
  <circle cx="1366" cy="1200" r="800" fill="none" stroke="#2dd36f" stroke-width="2" opacity="0.1" />

  <!-- Center Logo Mark -->
  <g transform="translate(1366, 1150)" filter="url(#glow)">
    <!-- Rounded App Icon Background -->
    <rect x="-240" y="-240" width="480" height="480" rx="110" fill="url(#cardGrad)" />
    
    <!-- Floating Credit Card inside logo -->
    <rect x="-160" y="-100" width="320" height="200" rx="24" fill="#ffffff" />
    <!-- Top banner on card -->
    <path d="M -160 -76 Q -160 -100 -136 -100 L 136 -100 Q 160 -100 160 -76 L 160 -40 L -160 -40 Z" fill="#1e293b" />
    <!-- Chip -->
    <rect x="-125" y="-15" width="50" height="40" rx="8" fill="url(#chipGrad)" />
    <!-- Card stripes -->
    <rect x="-125" y="45" width="120" height="12" rx="6" fill="#cbd5e1" />
    <rect x="-125" y="65" width="75" height="10" rx="5" fill="#e2e8f0" />
    
    <!-- Verified Badge -->
    <circle cx="85" cy="25" r="35" fill="#2dd36f" />
    <path d="M 72 25 L 81 34 L 99 16" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- PayFlow Title Text -->
  <text x="1366" y="1600" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    PayFlow
  </text>
  
  <text x="1366" y="1670" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    COMPRA Y PAGO INTELIGENTE
  </text>
</svg>
